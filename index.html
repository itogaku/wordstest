<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語プリントメーカー — Sunrise Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #faf7f0;
    --bg-deep: #f1ebdd;
    --surface: #ffffff;
    --surface-soft: #f6f1e6;
    --inset: #f0ead9;
    --sun: #d98f2b;
    --sun-deep: #b8741f;
    --sun-text: #a5661a;
    --mint: #0c7a64;
    --coral: #cf4327;
    --text: #24304a;
    --text-dim: #6b7385;
    --line: rgba(36,48,74,0.12);
    --r-lg: 22px;
    --r-md: 14px;
    --r-sm: 9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(180deg, var(--bg-deep), var(--bg) 60%);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app-shell{max-width: 760px; margin: 0 auto; padding: 20px 18px 60px;}
  h1,h2,h3{font-family:'Zen Maru Gothic'; font-weight:900; margin:0 0 6px;}
  .brandbar{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .brand-mark{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--sun),var(--sun-deep));box-shadow:0 0 14px rgba(217,143,43,0.35);flex-shrink:0;}
  .brand-text .en{font-family:'Zen Maru Gothic';font-weight:900;font-size:18px;}
  .brand-text .jp{font-size:11px;color:var(--text-dim);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px; margin-bottom:16px;}
  .setting-desc{font-size:13px; color:var(--text-dim); line-height:1.6;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--surface-soft); color:var(--text); font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Zen Maru Gothic'; transition:.1s;}
  .chip:active{transform:scale(0.95);}
  .chip.selected{background:linear-gradient(135deg,var(--sun),var(--sun-deep)); color:var(--text); border-color:var(--sun);}
  .week-row{display:flex; align-items:center; gap:14px; padding:13px 6px; border-bottom:1px solid var(--line); cursor:pointer;}
  .week-row:last-child{border-bottom:none;}
  .week-row.selected{background:rgba(217,143,43,0.08); border-radius:12px; margin:0 -6px; padding:13px 12px;}
  .prog-check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text);}
  .week-row.selected .prog-check{background:linear-gradient(135deg,var(--sun),var(--sun-deep));border-color:var(--sun);}
  .prog-check.partial{background:rgba(217,143,43,0.35);border-color:var(--sun-text);color:var(--sun-text);}
  .week-body{flex:1; min-width:0;}
  .week-name{font-family:'Zen Maru Gothic'; font-weight:800; font-size:15px;}
  .week-meta{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .expand-btn{font-size:11px;color:var(--text-dim);padding:6px 10px;cursor:pointer;flex-shrink:0;white-space:nowrap;}
  .expand-btn:hover{color:var(--sun-text);}
  .sec-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .important-badge{color:var(--coral);margin-left:5px;font-size:11px;}
  .elem-badge{color:var(--mint);margin-left:5px;font-size:10px;border:1px solid var(--mint);border-radius:6px;padding:1px 5px;white-space:nowrap;}
  .sec-row:last-child{border-bottom:none;}
  .sec-row.selected{background:rgba(217,143,43,0.08);border-radius:10px;margin:0 -6px;padding:10px 6px;}
  .sec-row.selected .prog-check{background:linear-gradient(135deg,var(--sun),var(--sun-deep));border-color:var(--sun);}
  .sec-name{font-weight:700;font-size:13.5px;flex:1;}
  .sec-count{font-size:11.5px;color:var(--text-dim);}
  .btn{font-family:'Zen Maru Gothic'; font-weight:700; font-size:15px; border:none; border-radius:14px; padding:15px 20px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; transition:.12s;}
  .btn-primary{background:linear-gradient(135deg,var(--sun),var(--sun-deep)); color:var(--text);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-primary:active{transform:scale(0.97);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
  .search-input{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:14px; font-family:'Zen Kaku Gothic New'; box-sizing:border-box;}
  .btn-ghost:active{transform:scale(0.97);}
  .back-row{font-size:13px; color:var(--text-dim); cursor:pointer; margin-bottom:10px; display:flex; align-items:center; gap:4px;}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:999px; font-size:13px; z-index:50; opacity:0; transition:.25s; pointer-events:none; box-shadow:0 4px 16px rgba(0,0,0,0.08);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  /* ---------- printable sheet ---------- */
  #printSheet{ display:none; margin-top:18px; }
  #printSheet.preview-visible{ display:block; }
  .sheet-page{ background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 3px 14px rgba(36,48,74,0.08); padding:22px 20px; margin-bottom:22px; max-width:640px; margin-left:auto; margin-right:auto; }
  .sheet-header{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #222; padding-bottom:6px; margin-bottom:14px; }
  .sheet-title{ font-family:'Zen Maru Gothic'; font-weight:900; font-size:17px; color:#111; }
  .sheet-sub{ font-size:11px; color:#555; }

  .wl-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .wl-table td{ padding:6px 8px; border-bottom:1px solid #ccc; vertical-align:top; }
  .wl-table .wcol{ font-family:'JetBrains Mono'; font-weight:700; width:38%; color:#111; }
  .wl-table .mcol{ color:#333; }
  .wl-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 22px; }

  .write-row{ display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid #ddd; page-break-inside:avoid; }
  .write-word{ font-family:'JetBrains Mono'; font-weight:700; font-size:13px; color:#999; width:110px; flex-shrink:0; }
  .write-meaning{ font-size:11.5px; color:#333; width:120px; flex-shrink:0; }
  .write-lines{ flex:1; display:flex; gap:6px; }
  .write-line{ flex:1; height:20px; border-bottom:1px solid #888; }

  .blank-item{ padding:9px 2px; border-bottom:1px solid #ddd; page-break-inside:avoid; }
  .blank-num{ font-weight:700; margin-right:6px; }
  .blank-meaning{ font-size:12px; color:#333; }
  .ja-highlight{ color:#c0392b; font-weight:700; }
  .blank-example{ font-size:12px; color:#444; margin-top:3px; }
  .blank-underline{ display:inline-block; border-bottom:2px solid #333; min-width:110px; height:3.2em; vertical-align:text-bottom; margin:0 4px; }
  .blank-answer-line{ margin-top:4px; border-bottom:1px solid #999; height:18px; }
  .blank-answer-multi{ display:flex; gap:10px; margin-top:4px; align-items:flex-end; }
  .blank-answer-seg{ flex:1; border-bottom:1px solid #999; height:18px; }
  .blank-answer-gap{ flex:0.6; height:18px; text-decoration-line:underline; text-decoration-style:wavy; text-decoration-color:#999; text-decoration-thickness:1.5px; }
  .blank-answer-ellipsis{ flex:0.4; height:18px; display:flex; align-items:flex-end; justify-content:center; color:#555; font-size:15px; padding-bottom:1px; }

  .fold-instructions{ font-size:11px; color:#555; margin-bottom:10px; line-height:1.7; }
  .fold-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .fold-table td{ padding:7px 6px; border-bottom:1px solid #ddd; vertical-align:middle; }
  .fold-table td.fold-ja{ width:25%; color:#333; }
  .fold-practice{ width:44%; border-left:1px dashed #ccc; }
  .fold-en{ width:17%; font-family:'JetBrains Mono'; font-weight:700; color:#111; border-left:2px dashed #333; padding-left:10px; }
  .fold-ja-h,.fold-practice-h,.fold-en-h{ font-size:10px; color:#999; font-weight:400; padding-bottom:4px; border-bottom:2px solid #333; }
  .fold-practice-h{ border-left:1px dashed #ccc; }
  .fold-en-h{ border-left:2px dashed #333; padding-left:10px; }
  .landscape .fold-ja{ width:20%; }
  .landscape .fold-practice{ width:56%; }
  .landscape .fold-en{ width:14%; }

  .check-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:4px 14px; }
  .landscape .check-grid{ grid-template-columns:repeat(6, 1fr); }
  .check-item{ display:flex; align-items:baseline; gap:5px; padding:5px 2px; border-bottom:1px solid #eee; font-size:12px; }
  .check-num{ color:#999; font-size:10px; flex-shrink:0; }
  .check-en{ font-family:'JetBrains Mono'; font-weight:700; color:#111; }

  .word-select-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:0 18px; }
  @media (max-width: 900px){ .word-select-grid{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width: 560px){ .word-select-grid{ grid-template-columns:1fr; } }
  .word-select-item{ display:flex; align-items:flex-start; gap:8px; padding:7px 4px; border-bottom:1px solid #eee; cursor:pointer; }
  .word-select-item input[type=checkbox]{ width:17px; height:17px; margin-top:2px; flex-shrink:0; accent-color: var(--sun-text); }
  .word-select-body{ min-width:0; }
  .word-select-word{ font-weight:700; font-size:13px; }
  .word-select-meaning{ font-size:11px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .word-select-group-header{ grid-column:1/-1; font-size:11px; font-weight:700; color:var(--sun-deep); padding:10px 4px 4px; border-top:1px solid var(--line); }

  .blank-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 20px; }
  .landscape .blank-grid{ grid-template-columns:1fr 1fr 1fr; }

  @media print{
    body{ background:#fff; }
    #app-shell{ display:none; }
    #printSheet{ display:block !important; margin-top:0; }
    .sheet-page{ border:none; box-shadow:none; padding:0; margin-bottom:0; border-radius:0; max-width:none; page-break-after:always; }
    .sheet-page:last-child{ page-break-after:auto; }
  }
</style>
<style id="orientationStyle"></style>
</head>
<body>

  <div class="brandbar">
    <div class="brand-mark"></div>
    <div class="brand-text"><div class="en">単語プリントメーカー</div><div class="jp">Sunrise Words 印刷版</div></div>
  </div>
  <div id="root"></div>
  <div class="toast" id="toast"></div>
</div>
<div id="printSheet"></div>
<script>
const PROGRAM_VOCAB = [{"grade": 3, "program": 1, "section": "scene1", "order": 1, "word": "someone", "source": "new", "level": "core", "meaning": "だれか", "example_en": "Someone is at the door.", "example_ja": "誰かがドアのところにいます。", "important": true}, {"grade": 3, "program": 1, "section": "scene1", "order": 2, "word": "suitcase", "source": "new", "level": "core", "meaning": "スーツケース", "example_en": "She packed her suitcase for the trip.", "example_ja": "彼女は旅行のためにスーツケースに荷物を詰めました。", "important": false}, {"grade": 3, "program": 1, "section": "scene1", "order": 3, "word": "chair", "source": "elementary", "level": "review", "meaning": "いす", "example_en": "Please sit on this chair.", "example_ja": "このいすに座ってください。", "important": true}, {"grade": 3, "program": 1, "section": "scene1", "order": 4, "word": "schoolyard", "source": "new", "level": "core", "meaning": "校庭", "example_en": "We play soccer in the schoolyard.", "example_ja": "私たちは校庭でサッカーをします。", "important": false}, {"grade": 3, "program": 1, "section": "scene1", "order": 5, "word": "window", "source": "elementary", "level": "review", "meaning": "窓、ショーウィンドー", "example_en": "Please open the window.", "example_ja": "窓を開けてください。", "important": true}, {"grade": 3, "program": 1, "section": "part1", "order": 6, "word": "cherry blossom", "source": "new", "level": "core", "meaning": "サクラの花", "example_en": "We saw cherry blossoms in April.", "example_ja": "私たちは4月にサクラの花を見ました。", "important": false}, {"grade": 3, "program": 1, "section": "part1", "order": 7, "word": "starving", "source": "new", "level": "core", "meaning": "（死にそうなほどおなかがすいて）餓死しそうな", "example_en": "I am starving after the game.", "example_ja": "私は試合の後とてもお腹がすいています。", "important": false}, {"grade": 3, "program": 1, "section": "part1", "order": 8, "word": "carrot", "source": "elementary", "level": "review", "meaning": "ニンジン", "example_en": "I don't like carrots.", "example_ja": "私はニンジンが好きではありません。", "important": false}, {"grade": 3, "program": 1, "section": "part1", "order": 9, "word": "noon", "source": "new", "level": "core", "meaning": "正午", "example_en": "We eat lunch at noon.", "example_ja": "私たちは正午に昼食を食べます。", "important": true}, {"grade": 3, "program": 1, "section": "part1", "order": 10, "word": "colorful", "source": "new", "level": "core", "meaning": "カラフルな、色彩豊かな", "example_en": "The garden is colorful in spring.", "example_ja": "その庭は春に色とりどりです。", "important": true}, {"grade": 3, "program": 1, "section": "part1", "order": 11, "word": "Here is ～.", "source": "new", "level": "core", "meaning": "こちらが～です。", "example_en": "Here is your ticket.", "example_ja": "はい、あなたのチケットです。", "important": false}, {"grade": 3, "program": 1, "section": "part1", "order": 12, "word": "this way", "source": "new", "level": "core", "meaning": "この方法で", "example_en": "You can learn a lot this way.", "example_ja": "この方法でたくさん学べます。", "important": false}, {"grade": 3, "program": 1, "section": "scene2", "order": 13, "word": "eel", "source": "new", "level": "core", "meaning": "ウナギ", "example_en": "I ate grilled eel for lunch.", "example_ja": "私は昼食にうなぎの蒲焼を食べました。", "important": false}, {"grade": 3, "program": 1, "section": "scene2", "order": 14, "word": "marathon", "source": "new", "level": "core", "meaning": "マラソン", "example_en": "My father ran a marathon.", "example_ja": "私の父はマラソンを走りました。", "important": false}, {"grade": 3, "program": 1, "section": "scene2", "order": 15, "word": "run a marathon", "source": "new", "level": "core", "meaning": "マラソンに出る", "example_en": "My father runs a marathon every year.", "example_ja": "私の父は毎年マラソンを走ります。", "important": false}, {"grade": 3, "program": 1, "section": "scene2", "order": 16, "word": "musical instrument", "source": "new", "level": "core", "meaning": "楽器", "example_en": "I want to learn a musical instrument.", "example_ja": "私は楽器を習いたいです。", "important": false}, {"grade": 3, "program": 1, "section": "part2", "order": 17, "word": "homemade", "source": "new", "level": "core", "meaning": "自家製の", "example_en": "This is a homemade cake const IRREGULAR_VERBS = {
  run:['ran','run'], go:['went','gone'], get:['got','gotten'], give:['gave','given'], take:['took','taken'],
  do:['did','done'], have:['had','had'], make:['made','made'], come:['came','come'], become:['became','become'],

  sing:['sang','sung'], sit:['sat','sat'], sleep:['slept','slept'], speak:['spoke','spoken'], spend:['spent','spent'],
  stand:['stood','stood'], teach:['taught','taught'], tell:['told','told'], think:['thought','thought'],
  throw:['threw','thrown'], understand:['understood','understood'], wake:['woke','woken'], wear:['wore','worn'],
  win:['won','won'], write:['wrote','written'], shake:['shook','shaken'], swim:['swam','swum']
};
function conjugationCandidates(verb){
  const v = verb.toLowerCase();
  const cands = [v];
  if(v === 'be'){ return ['am','is','are','was','were','been','being']; }
  cands.push(v+'s');
  if(IRREGULAR_VERBS[v]) cands.push(...IRREGULAR_VERBS[v]);
  const doubling = /^[a-z]*[^aeiou][aeiou][bcdfgklmnprtvz]$/.test(v);
  if(/[^aeiou]y$/.test(v)){ cands.push(v.slice(0,-1)+'ied', v.slice(0,-1)+'ies'); cands.push(v+'ing'); }
  else if(/e$/.test(v) && v.length>2){ cands.push(v.slice(0,-1)+'ed'); cands.push(v.slice(0,-1)+'ing'); }
  else if(doubling){ cands.push(v+v[v.length-1]+'ed'); cands.push(v+v[v.length-1]+'ing'); }
  else{ cands.push(v+'ed'); cands.push(v+'ing'); }
  return cands;
}
const POSSESSIVE_WORDS = ['my','your','his','her','its','our','their'];
const REFLEXIVE_WORDS = ['myself','yourself','himself','herself','itself','ourselves','yourselves','themselves'];
function blankExample(en, word){
  if(!en) return {html: '', blanked:false};
  const apos = s => s.replace(/\u2019/g,"'");
  const enN = apos(en);
  const core = apos(word).replace(/～/g,' ').replace(/\.\.\./g,' ').replace(/[,.?!]/g,' ').replace(/\s+/g,' ').trim();
  if(!core) return {html: en, blanked:false};
  let idx = enN.toLowerCase().indexOf(core.toLowerCase());
  let matchLen = core.length;
  if(idx === -1){
    const tokens = core.split(' ');
    if(tokens.length > 1){
      for(const c of conjugationCandidates(tokens[0])){
        const candidate = [c, ...tokens.slice(1)].join(' ');
        const tryIdx = enN.toLowerCase().indexOf(candidate.toLowerCase());
        if(tryIdx !== -1){ idx = tryIdx; matchLen = candidate.length; break; }
      }
      if(idx === -1){
        const wildcardIdx = tokens.findIndex(t => t==="one's" || t==='oneself');
        if(wildcardIdx !== -1){
          const isReflexive = tokens[wildcardIdx] === 'oneself';
          const options = isReflexive ? REFLEXIVE_WORDS : POSSESSIVE_WORDS;
          for(const pronoun of options){
            const candTokens = tokens.slice(); candTokens[wildcardIdx] = pronoun;
            const candidate = candTokens.join(' ');
            const tryIdx = enN.toLowerCase().indexOf(candidate.toLowerCase());
            if(tryIdx !== -1){ idx = tryIdx; matchLen = candidate.length; break; }
          }
        }
      }
    }
  }
  if(idx === -1) return {html: en, blanked:false};
  const matched = en.slice(idx, idx+matchLen);
  const wordCount = matched.trim().split(/\s+/).filter(Boolean).length;
  const blanks = Array(wordCount).fill('<span class="blank-underline"></span>').join(' ');
  return {html: en.slice(0,idx) + blanks + en.slice(idx+matchLen), blanked:true};
}

        filter.sections = new Set(tr.sections);
        filter.levels = new Set(tr.levels && tr.levels.length ? tr.levels : LEVELS.map(l=>l.key));
        filter.expanded = new Set();
        renderPicker();
      };
      const delBtn = document.createElement('div');
      delBtn.className = 'expand-btn';
      delBtn.style.color = 'var(--coral)';
      delBtn.textContent = '削除';
      delBtn.onclick = (ev)=>{
        ev.stopPropagation();
        const updated = testRanges.filter((_,i)=>i!==tri);
        saveTestRanges(updated);
        renderPicker();
      };
      row.appendChild(applyBtn);
      row.appendChild(delBtn);
      trList.appendChild(row);
    });
  }

  if(PROGRAM_GRADES.length>1){
    const gc = document.getElementById('gradeChips');
    PROGRAM_GRADES.forEach(gr=>{
      const chip = document.createElement('div');
      chip.className = 'chip' + (filter.grade===gr ? ' selected':'');
      chip.textContent = gr+'年生';
      chip.onclick = ()=>{ filter.grade = gr; filter.sections = null; filter.expanded = null; renderPicker(); };
      gc.appendChild(chip);
    });
  }

  const card = document.getElementById('progCard');
  programsForGrade.forEach(pnum=>{
    const entries = entriesForGrade.filter(e=>e.program===pnum).sort((a,b)=>a.order-b.order);
    const sectionsInOrder = [];
    for(const e of entries){ if(!sectionsInOrder.includes(e.section)) sectionsInOrder.push(e.section); }
    const allKeys = sectionsInOrder.map(sec=>g+'|'+pnum+'|'+sec);
    const selectedCount = allKeys.filter(k=>filter.sections.has(k)).length;
    const state = selectedCount===0 ? 'none' : (selectedCount===allKeys.length ? 'all' : 'partial');
    const isExpanded = filter.expanded.has(pnum);

    const row = document.createElement('div');
    row.className = 'week-row selectable' + (state==='all' ? ' selected' : '');
    row.innerHTML = `
      <div class="prog-check${state==='partial'?' partial':''}">${state==='all'?'✓':(state==='partial'?'−':'')}</div>
      <div class="week-body">
        <div class="week-name">${programLabel(pnum, g)}</div>
        <div class="week-meta">${entries.length}語${state==='partial'?`（${selectedCount}セクション選択中）`:''}</div>
      </div>
      <div class="expand-btn" id="expand-p${pnum}">${isExpanded ? '閉じる ▲' : 'さらに選ぶ ▼'}</div>`;
    row.onclick = ()=>{
      if(state === 'all'){ allKeys.forEach(k=>filter.sections.delete(k)); }
      else{ allKeys.forEach(k=>filter.sections.add(k)); }
      renderPicker();
    };
    card.appendChild(row);

    if(isExpanded){
      const sub = document.createElement('div');
      sub.style.padding = '2px 4px 10px 48px';
      sectionsInOrder.forEach(sec=>{
        const secEntries = entries.filter(e=>e.section===sec);
        const key = g+'|'+pnum+'|'+sec;
        const selected = filter.sections.has(key);
        const srow = document.createElement('div');
        srow.className = 'sec-row' + (selected ? ' selected' : '');
        srow.innerHTML = `
          <div class="prog-check">${selected ? '✓' : ''}</div>
          <div class="sec-name">${sec}</div>
          <div class="sec-count">${secEntries.length}語</div>`;
        srow.onclick = (ev)=>{
          ev.stopPropagation();
          if(filter.sections.has(key)) filter.sections.delete(key);
          else filter.sections.add(key);
          renderPicker();
        };
        sub.appendChild(srow);
      });
      card.appendChild(sub);
    }

    document.getElementById('expand-p'+pnum).onclick = (ev)=>{
      ev.stopPropagation();
      if(filter.expanded.has(pnum)) filter.expanded.delete(pnum);
      else filter.expanded.add(pnum);
      renderPicker();
    };
  });

  const lc = document.getElementById('levelChips');
  LEVELS.forEach(l=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (filter.levels.has(l.key) ? ' selected':'');
    chip.textContent = l.label;
    chip.onclick = ()=>{
      if(filter.levels.has(l.key)) filter.levels.delete(l.key);
      else filter.levels.add(l.key);
      renderPicker();
    };
    lc.appendChild(chip);
  });

  const selectedLevels = [...filter.levels];
  const matchedEntries = entriesForGrade.filter(e=>filter.sections.has(e.grade+'|'+e.program+'|'+e.section) && selectedLevels.includes(wordCategory(e)));
  const seenW = new Set(); const matchedWords = [];
  for(const e of matchedEntries){ if(!seenW.has(e.word)){ seenW.add(e.word); matchedWords.push(e); } }
  matchedWords.sort((a,b)=> a.program-b.program || a.order-b.order);
  document.getElementById('countDesc').textContent = filter.sections.size ? `選択中: ${matchedWords.length}語` : 'Programを1つ以上選んでください';
  const nextBtn = document.getElementById('btnNext');
  nextBtn.disabled = matchedWords.length === 0;
  nextBtn.onclick = ()=>{
    const selectedPrograms = [...new Set(matchedEntries.map(e=>e.program))].sort((a,b)=>a-b);
    const rangeLabel = selectedPrograms.length===1 ? programLabel(selectedPrograms[0], g) : `${programLabel(selectedPrograms[0], g)}〜${programLabel(selectedPrograms[selectedPrograms.length-1], g)}`;
    printCtx = { grade:g, allWords: matchedWords, selected: null, rangeLabel };
    nav({screen:'review'});
  };

  const saveBtn = document.getElementById('btnSaveRange');
  saveBtn.disabled = filter.sections.size === 0;
  saveBtn.onclick = ()=>{
    const form = document.getElementById('saveRangeForm');
    form.style.display = '';
    form.innerHTML = `
      <input class="search-input" id="rangeNameInput" placeholder="テスト範囲の名前（例：中間テスト範囲）" style="margin-bottom:8px;">
      <button class="btn btn-primary" id="btnConfirmSave">保存する</button>
    `;
    const input = document.getElementById('rangeNameInput');
    input.focus();
    document.getElementById('btnConfirmSave').onclick = ()=>{
      const name = input.value.trim();
      if(!name){ showToast('名前を入力してください'); return; }
      const testRanges = loadTestRanges();
      testRanges.push({ name, grade: g, sections: [...filter.sections], levels: [...filter.levels] });
      saveTestRanges(testRanges);
      showToast('テスト範囲を保存しました');
      renderPicker();
    };
    input.onkeydown = (e)=>{ if(e.key==='Enter') document.getElementById('btnConfirmSave').onclick(); };
  };
}

let printCtx = null;
let printOrientation = 'portrait';

    ? '@media print { @page { size: landscape; margin: 12mm 14mm; } }'
    : '@media print { @page { size: portrait; margin: 14mm 12mm; } }';

  if(printOrientation === 'landscape') sheet.classList.add('landscape');
  else sheet.classList.remove('landscape');
}
const globallyExcludedWords = new Set(); // persists across range re-selection within the session

    printCtx.selected = new Set(printCtx.allWords.slice(0,20).map(e=>e.word));
  }
  const FOLD_PAGE_SIZE = 20;

    <div class="chip-row" id="reviewChips" style="margin-bottom:12px;"></div>

  function refreshChips(){
    chipsEl.innerHTML = '';

    const firstPageChip = document.createElement('div');
    firstPageChip.className = 'chip';

      printCtx.selected = new Set(printCtx.allWords.slice(0,FOLD_PAGE_SIZE).map(e=>e.word));
      refresh();

    const selAllChip = document.createElement('div');

    selAllChip.onclick = ()=>{
      visibleWords().forEach(e=>printCtx.selected.add(e.word));
      refresh();
    };
    const deselAllChip = document.createElement('div');
    deselAllChip.className = 'chip';
    deselAllChip.textContent = '☐ 全て解除';
    deselAllChip.onclick = ()=>{
      visibleWords().forEach(e=>printCtx.selected.delete(e.word));
      refresh();
    };
    chipsEl.appendChild(boldChip);
    chipsEl.appendChild(firstPageChip);
    chipsEl.appendChild(selAllChip);
    chipsEl.appendChild(deselAllChip);
  }

  function refresh(){
    const selectedCount = printCtx.allWords.filter(e=>printCtx.selected.has(e.word)).length;
    document.getElementById('remainCount').textContent = `（選択中 ${selectedCount} / 全${printCtx.allWords.length}語）`;
    box.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'word-select-grid';
    let lastGroup = null;
    visibleWords().forEach(e=>{
      const groupKey = e.program + '|' + e.section;
      if(groupKey !== lastGroup){
        lastGroup = groupKey;

        header.className = 'word-select-group-header';
        header.textContent = `${programLabel(e.program, e.grade)} - ${e.section}`;
        grid.appendChild(header);

      const checked = printCtx.selected.has(e.word);
      const item = document.createElement('label');

      item.innerHTML = `

          <div class="word-select-word">${e.word}${categoryBadgeHtml(e)}</div>

      const cb = item.querySelector('input');

        if(cb.checked) printCtx.selected.add(e.word);

      nav({screen:'preview'});
    };
  }

  refreshChips();
  refresh();
}

function answerLineHtml(word){
  const tokens = word.replace(/\.\.\./g,'…').split(/\s+/).filter(Boolean);
  if(tokens.length <= 1) return '<div class="blank-answer-line"></div>';
  const parts = tokens.map(t=>{
    if(t === '～') return '<div class="blank-answer-gap">&nbsp;&nbsp;&nbsp;</div>';
    if(t === '…') return '<div class="blank-answer-ellipsis">…</div>';
    return '<div class="blank-answer-seg"></div>';
  });
  return `<div class="blank-answer-multi">${parts.join('')}</div>`;
}

function toHiragana(s){ return s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function toKatakana(s){ return s.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)); }

function highlightMeaningInJa(ja, meaning){
  if(!ja || !meaning) return ja;
  const segments = meaning.split(/[、，,（(）)]/).map(s=>s.trim()).filter(Boolean);
  const jaVariants = [ja, toHiragana(ja), toKatakana(ja)];
  for(const seg of segments){
    const minLen = seg.length <= 1 ? 1 : 2;
    for(let len = seg.length; len >= minLen; len--){
      const candidate = seg.slice(0, len);
      for(const jaVariant of jaVariants){
        const idx = jaVariant.indexOf(candidate);
        if(idx !== -1){
          return ja.slice(0,idx) + '<span class="ja-highlight">' + ja.slice(idx, idx+candidate.length) + '</span>' + ja.slice(idx+candidate.length);
        }
      }
    }
  }
  const fallback = segments[0] || meaning;
  return ja + `<span class="ja-highlight">（${fallback}）</span>`;
}

function chunk(arr, size){
  const out = [];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}

const SHEET_TYPES = [
  {key:'checklist', label:'単語一覧（チェック用）'},
  {key:'fold', label:'折って覚えるシート'},
  {key:'blank', label:'空所補充'},
  {key:'answer', label:'空所補充・解答'},
];
let includedSheets = new Set(['checklist','fold','blank','answer']);

function renderPreview(){
  root.innerHTML = `
    <div class="back-row" id="back">← 単語の確認にもどる</div>
    <h2 style="margin-bottom:4px;">プレビュー</h2>
    <div class="setting-desc" style="margin-bottom:10px;">${printCtx.grade}年生・${printCtx.rangeLabel}（${printCtx.words.length}語）。</div>
    <div class="setting-desc" style="margin-bottom:8px;">印刷するシートを選ぶ（単語一覧だけを印刷することもできます）</div>
    <div class="chip-row" id="sheetChips" style="margin-bottom:16px;"></div>
    <div class="setting-desc" style="margin-bottom:8px;">印刷の向き（単語数が多いときは縦、少なく絞って書く練習を広くしたいときは横がおすすめです）</div>
    <div class="chip-row" id="orientChips" style="margin-bottom:16px;"></div>
    <button class="btn btn-primary" id="btnPrint">🖨 印刷する</button>
    <button class="btn btn-ghost" id="btnBack2" style="margin-top:10px;">単語の確認にもどる</button>
  `;
  document.getElementById('back').onclick = ()=>nav({screen:'review'});
  document.getElementById('btnBack2').onclick = ()=>nav({screen:'review'});

  const sheetChips = document.getElementById('sheetChips');
  SHEET_TYPES.forEach(s=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (includedSheets.has(s.key) ? ' selected':'');
    chip.textContent = s.label;
    chip.onclick = ()=>{
      if(includedSheets.has(s.key)) includedSheets.delete(s.key);
      else includedSheets.add(s.key);
      renderPreview();
    };
    sheetChips.appendChild(chip);
  });

  const orientChips = document.getElementById('orientChips');
  [{key:'portrait', label:'縦'}, {key:'landscape', label:'横'}].forEach(o=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (printOrientation===o.key ? ' selected':'');
    chip.textContent = o.label;
    chip.onclick = ()=>{ printOrientation = o.key; renderPreview(); };
    orientChips.appendChild(chip);
  });

  buildPrintSheet(printCtx.words, printCtx.grade, printCtx.rangeLabel);
  applyOrientationStyle();
  document.getElementById('printSheet').classList.add('preview-visible');
  const printBtn = document.getElementById('btnPrint');
  printBtn.disabled = includedSheets.size === 0;
  printBtn.onclick = ()=>{ window.print(); };
}

function sheetHeader(title, sub){
  return `<div class="sheet-header"><div class="sheet-title">${title}</div><div class="sheet-sub">${sub}</div></div>`;
}

function buildChecklistPages(words, title){
  const byProgram = new Map();
  words.forEach(e=>{
    const key = e.program + '|' + e.grade;
    if(!byProgram.has(key)) byProgram.set(key, {program:e.program, grade:e.grade, items:[]});
    byProgram.get(key).items.push(e);
  });
  const groups = [...byProgram.values()].sort((a,b)=> a.program-b.program);
  groups.forEach(g=> g.items.sort((a,b)=> a.word.toLowerCase().localeCompare(b.word.toLowerCase())));

  const perPage = 90;
  const out = [];
  let pageWords = [];
  let pageGroupLabels = [];
  function flushPage(){
    if(pageWords.length===0) return;
    const page = document.createElement('div');
    page.className = 'sheet-page';
    page.innerHTML = sheetHeader(title, `単語一覧（チェック用） ${out.length+1}ページ`) +
      `<div class="fold-instructions">覚えた単語は横線で消す、まちがえた単語は◯で囲んでください。（Program別・アルファベット順）</div>`;
    const grid = document.createElement('div');
    grid.className = 'check-grid';
    pageWords.forEach(item=>{
      if(item.isHeader){
        const h = document.createElement('div');
        h.className = 'word-select-group-header';
        h.textContent = item.label;
        grid.appendChild(h);
      }else{
        const e = item.entry;
        const div = document.createElement('div');
        div.className = 'check-item';
        div.innerHTML = `<span class="check-en">${e.word}</span>`;
        grid.appendChild(div);
      }
    });
    page.appendChild(grid);
    out.push(page);
    pageWords = [];
  }

  groups.forEach(g=>{
    if(pageWords.filter(x=>!x.isHeader).length >= perPage) flushPage();
    pageWords.push({isHeader:true, label: programLabel(g.program, g.grade)});
    g.items.forEach(e=>{
      if(pageWords.filter(x=>!x.isHeader).length >= perPage){
        flushPage();
        pageWords.push({isHeader:true, label: programLabel(g.program, g.grade) + '（続き）'});
      }
      pageWords.push({isHeader:false, entry:e});
    });
  });
  flushPage();
  return out;
}

function wordTokenCount(word){
  return word.replace(/\.\.\./g,'…').split(/\s+/).filter(t=>t && t!=='～' && t!=='…').length;
}

function buildFoldPages(words, title){
  const perPage = printOrientation === 'landscape' ? 13 : 20;
  const pages = chunk(words, perPage);
  const out = [];
  pages.forEach((pageWords, pi)=>{
    const page = document.createElement('div');
    page.className = 'sheet-page';
    page.innerHTML = sheetHeader(title, `折って覚えるシート ${pi+1}/${pages.length}ページ`) +
      `<div class="fold-instructions">① 点線で谷折りにして右の英語を隠す　② 日本語を見て真ん中に英語を書く（（　）内の数字は単語の数）　③ 開いて答え合わせ　④ 間違えた単語は真ん中のスペースに何度も書いて練習する</div>`;
    const table = document.createElement('table');
    table.className = 'fold-table';
    const thead = document.createElement('tr');
    thead.innerHTML = `<td class="fold-ja-h">日本語</td><td class="fold-practice-h">書いて練習</td><td class="fold-en-h">英語（答え）</td>`;
    table.appendChild(thead);
    pageWords.forEach(e=>{
      const n = wordTokenCount(e.word);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="fold-ja">${e.meaning}${n>=2 ? `<span style="color:var(--ink-soft); font-weight:400;">（${n}語）</span>` : ''}</td>
        <td class="fold-practice"></td>
        <td class="fold-en">${e.word}</td>`;
      table.appendChild(tr);
    });
    page.appendChild(table);
    out.push(page);
  });
  return out;
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildBlankPages(shuffledWords, title){
  const perPage = 30;
  const pages = chunk(shuffledWords, perPage);
  const out = [];
  pages.forEach((pageWords, pi)=>{
    const page = document.createElement('div');
    page.className = 'sheet-page';
    page.innerHTML = sheetHeader(title, `空所補充（例文の穴埋め） ${pi+1}/${pages.length}ページ`);
    const grid = document.createElement('div');
    grid.className = 'blank-grid';
    pageWords.forEach(e=>{
      const div = document.createElement('div');
      div.className = 'blank-item';
      const ex = e.example_en ? blankExample(e.example_en, e.word) : null;
      const hint = (ex && e.example_ja) ? highlightMeaningInJa(e.example_ja, e.meaning) : `意味：${e.meaning}`;
      div.innerHTML = `
        <div class="blank-meaning">${hint}</div>
        ${ex ? `<div class="blank-example">${ex.html}</div>` : `<div class="blank-example">${answerLineHtml(e.word)}</div>`}`;
      grid.appendChild(div);
    });
    page.appendChild(grid);
    out.push(page);
  });
  return out;
}

function buildAnswerPages(shuffledWords, title){
  const perPage = 30;
  const pages = chunk(shuffledWords, perPage);
  const out = [];
  pages.forEach((pageWords, pi)=>{
    const page = document.createElement('div');
    page.className = 'sheet-page';
    page.innerHTML = sheetHeader(title, `空所補充・解答（問題と同じ順番） ${pi+1}/${pages.length}ページ`);
    const grid = document.createElement('div');
    grid.className = 'blank-grid';
    pageWords.forEach(e=>{
      const div = document.createElement('div');
      div.className = 'blank-item';
      div.innerHTML = `<span class="wcol">${e.word}</span>`;
      grid.appendChild(div);
    });
    page.appendChild(grid);
    out.push(page);
  });
  return out;
}

function buildPrintSheet(words, grade, rangeLabel){
  const sheet = document.getElementById('printSheet');
  sheet.innerHTML = '';
  const title = `${grade}年生 単語プリント（${rangeLabel}）`;
  if(!printCtx.shuffledBlankWords) printCtx.shuffledBlankWords = shuffleArray(words);
  if(!printCtx.shuffledFoldWords) printCtx.shuffledFoldWords = shuffleArray(words);
  if(includedSheets.has('checklist')) buildChecklistPages(words, title).forEach(p=>sheet.appendChild(p));
  if(includedSheets.has('fold')) buildFoldPages(printCtx.shuffledFoldWords, title).forEach(p=>sheet.appendChild(p));
  if(includedSheets.has('blank')) buildBlankPages(printCtx.shuffledBlankWords, title).forEach(p=>sheet.appendChild(p));
  if(includedSheets.has('answer')) buildAnswerPages(printCtx.shuffledBlankWords, title).forEach(p=>sheet.appendChild(p));
}

nav({screen:'picker'});
