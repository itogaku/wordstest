<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語プリントメーカー — Sunrise Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #faf7f0;
    --bg-deep: #f1ebdd;
    --surface: #ffffff;
    --surface-soft: #f6f1e6;
    --inset: #f0ead9;
    --sun: #d98f2b;
    --sun-deep: #b8741f;
    --sun-text: #a5661a;
    --mint: #0c7a64;
    --coral: #cf4327;
    --text: #24304a;
    --text-dim: #6b7385;
    --line: rgba(36,48,74,0.12);
    --r-lg: 22px;
    --r-md: 14px;
    --r-sm: 9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(180deg, var(--bg-deep), var(--bg) 60%);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app-shell{max-width: 760px; margin: 0 auto; padding: 20px 18px 60px;}
  h1,h2,h3{font-family:'Zen Maru Gothic'; font-weight:900; margin:0 0 6px;}
  .brandbar{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .brand-mark{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--sun),var(--sun-deep));box-shadow:0 0 14px rgba(217,143,43,0.35);flex-shrink:0;}
  .brand-text .en{font-family:'Zen Maru Gothic';font-weight:900;font-size:18px;}
  .brand-text .jp{font-size:11px;color:var(--text-dim);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px; margin-bottom:16px;}
  .setting-desc{font-size:13px; color:var(--text-dim); line-height:1.6;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--surface-soft); color:var(--text); font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Zen Maru Gothic'; transition:.1s;}
  .chip:active{transform:scale(0.95);}
  .chip.selected{background:linear-gradient(135deg,var(--sun),var(--sun-deep)); color:var(--text); border-color:var(--sun);}
  .week-row{display:flex; align-items:center; gap:14px; padding:13px 6px; border-bottom:1px solid var(--line); cursor:pointer;}
  .week-row:last-child{border-bottom:none;}
  .week-row.selected{background:rgba(217,143,43,0.08); border-radius:12px; margin:0 -6px; padding:13px 12px;}
  .prog-check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text);}
  .week-row.selected .prog-check{background:linear-gradient(135deg,var(--sun),var(--sun-deep));border-color:var(--sun);}
  .prog-check.partial{background:rgba(217,143,43,0.35);border-color:var(--sun-text);color:var(--sun-text);}
  .week-body{flex:1; min-width:0;}
  .week-name{font-family:'Zen Maru Gothic'; font-weight:800; font-size:15px;}
  .week-meta{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .expand-btn{font-size:11px;color:var(--text-dim);padding:6px 10px;cursor:pointer;flex-shrink:0;white-space:nowrap;}
  .expand-btn:hover{color:var(--sun-text);}
  .sec-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .sec-row:last-child{border-bottom:none;}
  .sec-row.selected{background:rgba(217,143,43,0.08);border-radius:10px;margin:0 -6px;padding:10px 6px;}
  .sec-row.selected .prog-check{background:linear-gradient(135deg,var(--sun),var(--sun-deep));border-color:var(--sun);}
  .sec-name{font-weight:700;font-size:13.5px;flex:1;}
  .sec-count{font-size:11.5px;color:var(--text-dim);}
  .btn{font-family:'Zen Maru Gothic'; font-weight:700; font-size:15px; border:none; border-radius:14px; padding:15px 20px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; transition:.12s;}
  .btn-primary{background:linear-gradient(135deg,var(--sun),var(--sun-deep)); color:var(--text);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-primary:active{transform:scale(0.97);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
  .search-input{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:14px; font-family:'Zen Kaku Gothic New'; box-sizing:border-box;}
  .btn-ghost:active{transform:scale(0.97);}
  .back-row{font-size:13px; color:var(--text-dim); cursor:pointer; margin-bottom:10px; display:flex; align-items:center; gap:4px;}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:999px; font-size:13px; z-index:50; opacity:0; transition:.25s; pointer-events:none; box-shadow:0 4px 16px rgba(0,0,0,0.08);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  /* ---------- printable sheet ---------- */
  #printSheet{ display:none; margin-top:18px; }
  #printSheet.preview-visible{ display:block; }
  .sheet-page{ background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 3px 14px rgba(36,48,74,0.08); padding:22px 20px; margin-bottom:22px; max-width:640px; margin-left:auto; margin-right:auto; }
  .sheet-header{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #222; padding-bottom:6px; margin-bottom:14px; }
  .sheet-title{ font-family:'Zen Maru Gothic'; font-weight:900; font-size:17px; color:#111; }
  .sheet-sub{ font-size:11px; color:#555; }

  .wl-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .wl-table td{ padding:6px 8px; border-bottom:1px solid #ccc; vertical-align:top; }
  .wl-table .wcol{ font-family:'JetBrains Mono'; font-weight:700; width:38%; color:#111; }
  .wl-table .mcol{ color:#333; }
  .wl-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 22px; }

  .write-row{ display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid #ddd; page-break-inside:avoid; }
  .write-word{ font-family:'JetBrains Mono'; font-weight:700; font-size:13px; color:#999; width:110px; flex-shrink:0; }
  .write-meaning{ font-size:11.5px; color:#333; width:120px; flex-shrink:0; }
  .write-lines{ flex:1; display:flex; gap:6px; }
  .write-line{ flex:1; height:20px; border-bottom:1px solid #888; }

  .blank-item{ padding:9px 2px; border-bottom:1px solid #ddd; page-break-inside:avoid; }
  .blank-num{ font-weight:700; margin-right:6px; }
  .blank-meaning{ font-size:12px; color:#333; }
  .ja-highlight{ color:#c0392b; font-weight:700; }
  .blank-example{ font-size:12px; color:#444; margin-top:3px; }
  .blank-underline{ display:inline-block; border-bottom:2px solid #333; min-width:78px; height:1.5em; vertical-align:text-bottom; margin:0 3px; }
  .blank-answer-line{ margin-top:4px; border-bottom:1px solid #999; height:18px; }
  .blank-answer-multi{ display:flex; gap:10px; margin-top:4px; align-items:flex-end; }
  .blank-answer-seg{ flex:1; border-bottom:1px solid #999; height:18px; }
  .blank-answer-gap{ flex:0.6; height:18px; text-decoration-line:underline; text-decoration-style:wavy; text-decoration-color:#999; text-decoration-thickness:1.5px; }
  .blank-answer-ellipsis{ flex:0.4; height:18px; display:flex; align-items:flex-end; justify-content:center; color:#555; font-size:15px; padding-bottom:1px; }

  .fold-instructions{ font-size:11px; color:#555; margin-bottom:10px; line-height:1.7; }
  .fold-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .fold-table td{ padding:7px 6px; border-bottom:1px solid #ddd; vertical-align:middle; }
  .fold-num{ width:22px; color:#888; font-size:10.5px; }
  .fold-ja{ width:18%; color:#333; }
  .fold-practice{ width:46%; border-left:1px dashed #ccc; }
  .fold-en{ width:18%; font-family:'JetBrains Mono'; font-weight:700; color:#111; border-left:2px dashed #333; padding-left:10px; }
  .fold-ja-h,.fold-practice-h,.fold-en-h{ font-size:10px; color:#999; font-weight:400; padding-bottom:4px; border-bottom:2px solid #333; }
  .fold-practice-h{ border-left:1px dashed #ccc; }
  .fold-en-h{ border-left:2px dashed #333; padding-left:10px; }
  .landscape .fold-ja{ width:14%; }
  .landscape .fold-practice{ width:58%; }
  .landscape .fold-en{ width:15%; }

  .blank-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 20px; }
  .landscape .blank-grid{ grid-template-columns:1fr 1fr 1fr; }

  @media print{
    body{ background:#fff; }
    #app-shell{ display:none; }
    #printSheet{ display:block !important; margin-top:0; }
    .sheet-page{ border:none; box-shadow:none; padding:0; margin-bottom:0; border-radius:0; max-width:none; page-break-after:always; }
    .sheet-page:last-child{ page-break-after:auto; }
  }
</style>
<style id="orientationStyle"></style>
</head>
<body>
<div id="app-shell">
  <div class="brandbar">
    <div class="brand-mark"></div>
    <div class="brand-text"><div class="en">単語プリントメーカー</div><div class="jp">Sunrise Words 印刷版</div></div>
  </div>
  <div id="root"></div>
  <div class="toast" id="toast"></div>
</div>
<div id="printSheet"></div>
<script>
const PROGRAM_VOCAB = [{"grade": 3, "program": 1, "section": "scene1", "order": 1, "word": "someone", "source": "new", "level": "core", "meaning": "だれか", "example_en": "Someone is at the door.", "example_ja": "誰かがドアのところにいます。", "important": false}, {"grade": 3, "program": 1, "section": "scene1", "order": 2, "word": "suitcase", "source": "new", "level": "core", "meaning": "スーツケース", "example_en": "She packed her suitcase for the trip.", "example_ja": "彼女は旅行のためにスーツケースに荷物を詰めました。", "important": false}, {"grade": 3, "program": 1, "section": "scene1", "order": 3, "word": "chair", "source": "elementary", "level": "review", "meaning": "いす", "example_en": "Please sit on this chair.", "example_ja": "このいすに座ってください。", "important": false}, {"grade": 3, "program": 1, "section": "scene1", "order": 4, "word": "schoolyard", "source": "new", "level": "core", "meaning": "校庭", "example_en": "We play soccer in the schoolyard.", "example_ja": "私たちは校庭でサッカーをします。", "important": false}, {"grade": 3, "program": 1, "section": "scene1", "order": 5, "word": "window", "source": "elementary", "level": "review", "meaning": "窓、ショーウィンドー", "example_en": "Please open the window.", "example_ja": "窓を開けてください。", "important": true}, {"grade": 3, "program": 1, "section": "part1", "order": 6, "word": "cherry blossom", "source": "new", "level": "core", "meaning": "サクラの花", "example_en": "We saw cherry blossoms in April.", "example_ja": "私たちは4月にサクラの花を見ました。", "important": false}, {"grade": 3, "program": 1, "section": "part1", "order": 7, "word": "starving", "source": "new", "level": "core", "meaning": "（死にそうなほどおなかがすいて）餓死しそうな", "example_en": "I am starving after the game.", "example_ja": "私は試合の後とてもお腹がすいています。", "important": false}, {"grade": 3, "program": 1, "section": "part1", "order": 8, "word": "carrot", "source": "elementary", "level": "review", "meaning": "ニンジン", "example_en": "I don't like carrots.", "example_ja": "私はニンジンが好きではありません。", "important": false}, {"grade": 3, "program": 1, "section": "part1", "order": 9, "word": "noon", "source": "new", "level": "core", "meaning": "正午", "example_en": "We eat lunch at noon.", "example_ja": "私たちは正午に昼食を食べます。", "important": true}, {"grade": 3, "program": 1, "section": "part1", "order": 10, "word": "colorful", "source": "new", "level": "core", "meaning": "カラフルな、色彩豊かな", "example_en": "The garden is colorful in spring.", "example_ja": "その庭は春に色とりどりです。", "important": false}, {"grade": 3, "program": 1, "section": "part1", "order": 11, "word": "Here is ～.", "source": "new", "level": "core", "meaning": "こちらが～です。", "example_en": "Here is your ticket.", "example_ja": "はい、あなたのチケットです。", "important": false}, {"grade": 3, "program": 1, "section": "part1", "order": 12, "word": "this way", "source": "new", "level": "core", "meaning": "この方法で", "example_en": "You can learn a lot this way.", "example_ja": "この方法でたくさん学べます。", "important": false}, {"grade": 3, "program": 1, "section": "scene2", "order": 13, "word": "eel", "source": "new", "level": "core", "meaning": "ウナギ", "example_en": "I ate grilled eel for lunch.", "example_ja": "私は昼食にうなぎの蒲焼を食べました。", "important": false}, {"grade": 3, "program": 1, "section": "scene2", "order": 14, "word": "marathon", "source": "new", "level": "core", "meaning": "マラソン", "example_en": "My father ran a marathon.", "example_ja": "私の父はマラソンを走りました。", "important": false}, {"grade": 3, "program": 1, "section": "scene2", "order": 15, "word": "run a marathon", "source": "new", "level": "core", "meaning": "マラソンに出る", "example_en": "My father runs a marathon every year.", "example_ja": "私の父は毎年マラソンを走ります。", "important": false}, {"grade": 3, "program": 1, "section": "scene2", "order": 16, "word": "musical instrument", "source": "new", "level": "core", "meaning": "楽器", "example_en": "I want to learn a musical instrument.", "example_ja": "私は楽器を習いたいです。", "important": false}, {"grade": 3, "program": 1, "section": "part2", "order": 17, "word": "homemade", "source": "new", "level": "core", "meaning": "自家製の", "example_en": "This is a homemade cake.", "example_ja": "これは手作りのケーキです。", "important": false}, {"grade": 3, "program": 1, "section": "part2", "order": 18, "word": "travel", "source": "elementary", "level": "review", "meaning": "旅行する", "example_en": "I like to travel abroad.", "example_ja": "私は海外旅行が好きです。", "important": true}, {"grade": 3, "program": 1, "section": "part2", "order": 19, "word": "train", "source": "elementary", "level": "review", "meaning": "列車", "example_en": "I go to school by train.", "example_ja": "私は電車で学校に行きます。", "important": true}, {"grade": 3, "program": 1, "section": "part2", "order": 20, "word": "more than ～", "source": "new", "level": "core", "meaning": "～より多い", "example_en": "More than a hundred people came.", "example_ja": "100人以上の人々が来ました。", "important": false}, {"grade": 3, "program": 1, "section": "part2", "order": 21, "word": "such as ～", "source": "new", "level": "core", "meaning": "たとえば～など", "example_en": "I like fruit, such as apples.", "example_ja": "私はりんごのような果物が好きです。", "important": false}, {"grade": 3, "program": 1, "section": "scene3", "order": 22, "word": "cream puff", "source": "new", "level": "core", "meaning": "シュークリーム", "example_en": "I like cream puffs.", "example_ja": "私はシュークリームが好きです。", "important": false}, {"grade": 3, "program": 1, "section": "scene3", "order": 23, "word": "I've", "source": "new", "level": "core", "meaning": "（I haveの短縮形）", "example_en": "I've been to Kyoto twice.", "example_ja": "私は京都に2度行ったことがあります。", "important": false}, {"grade": 3, "program": 1, "section": "scene3", "order": 24, "word": "eaten", "source": "new", "level": "core", "meaning": "eat（食べる）の過去分詞", "example_en": "I have eaten this dish before.", "example_ja": "私は以前この料理を食べたことがあります。", "important": false}, {"grade": 3, "program": 1, "section": "scene3", "order": 25, "word": "so-so", "source": "new", "level": "core", "meaning": "まあまあの、よくも悪くもない", "example_en": "How was the movie? So-so.", "example_ja": "映画はどうでしたか。まあまあでした。", "important": false}, {"grade": 3, "program": 1, "section": "sce const IRREGULAR_VERBS = {
  run:['ran','run'], go:['went','gone'], get:['got','gotten'], give:['gave','given'], take:['took','taken'],
  do:['did','done'], have:['had','had'], make:['made','made'], come:['came','come'], become:['became','become'],
  begin:['began','begun'], buy:['bought','bought'], catch:['caught','caught'], choose:['chose','chosen'],
  cut:['cut','cut'], draw:['drew','drawn'], drink:['drank','drunk'], drive:['drove','driven'], eat:['ate','eaten'],
  fall:['fell','fallen'], feel:['felt','felt'], find:['found','found'], fly:['flew','flown'], forget:['forgot','forgotten'],
  grow:['grew','grown'], hear:['heard','heard'], hold:['held','held'], keep:['kept','kept'], know:['knew','known'],
  leave:['left','left'], lend:['lent','lent'], lose:['lost','lost'], meet:['met','met'], pay:['paid','paid'],
  put:['put','put'], read:['read','read'], ride:['rode','ridden'], rise:['rose','risen'], say:['said','said'],
  see:['saw','seen'], sell:['sold','sold'], send:['sent','sent'], set:['set','set'], show:['showed','shown'],
  sing:['sang','sung'], sit:['sat','sat'], sleep:['slept','slept'], speak:['spoke','spoken'], spend:['spent','spent'],
  stand:['stood','stood'], teach:['taught','taught'], tell:['told','told'], think:['thought','thought'],
  throw:['threw','thrown'], understand:['understood','understood'], wake:['woke','woken'], wear:['wore','worn'],
  win:['won','won'], write:['wrote','written'], shake:['shook','shaken'], swim:['swam','swum']
};
function conjugationCandidates(verb){
  const v = verb.toLowerCase();
  const cands = [v];
  if(v === 'be'){ return ['am','is','are','was','were','been','being']; }
  cands.push(v+'s');
  if(IRREGULAR_VERBS[v]) cands.push(...IRREGULAR_VERBS[v]);
  const doubling = /^[a-z]*[^aeiou][aeiou][bcdfgklmnprtvz]$/.test(v);
  if(/[^aeiou]y$/.test(v)){ cands.push(v.slice(0,-1)+'ied', v.slice(0,-1)+'ies'); cands.push(v+'ing'); }
  else if(/e$/.test(v) && v.length>2){ cands.push(v.slice(0,-1)+'ed'); cands.push(v.slice(0,-1)+'ing'); }
  else if(doubling){ cands.push(v+v[v.length-1]+'ed'); cands.push(v+v[v.length-1]+'ing'); }
  else{ cands.push(v+'ed'); cands.push(v+'ing'); }
  return cands;
}
const POSSESSIVE_WORDS = ['my','your','his','her','its','our','their'];
const REFLEXIVE_WORDS = ['myself','yourself','himself','herself','itself','ourselves','yourselves','themselves'];
function blankExample(en, word){
  if(!en) return {html: '', blanked:false};
  const apos = s => s.replace(/\u2019/g,"'");
  const enN = apos(en);
  const core = apos(word).replace(/～/g,' ').replace(/\.\.\./g,' ').replace(/[,.?!]/g,' ').replace(/\s+/g,' ').trim();
  if(!core) return {html: en, blanked:false};
  let idx = enN.toLowerCase().indexOf(core.toLowerCase());
  let matchLen = core.length;
  if(idx === -1){
    const tokens = core.split(' ');
    if(tokens.length > 1){
      for(const c of conjugationCandidates(tokens[0])){
        const candidate = [c, ...tokens.slice(1)].join(' ');
        const tryIdx = enN.toLowerCase().indexOf(candidate.toLowerCase());
        if(tryIdx !== -1){ idx = tryIdx; matchLen = candidate.length; break; }
      }
      if(idx === -1){
        const wildcardIdx = tokens.findIndex(t => t==="one's" || t==='oneself');
        if(wildcardIdx !== -1){
          const isReflexive = tokens[wildcardIdx] === 'oneself';
          const options = isReflexive ? REFLEXIVE_WORDS : POSSESSIVE_WORDS;
          for(const pronoun of options){
            const candTokens = tokens.slice(); candTokens[wildcardIdx] = pronoun;
            const candidate = candTokens.join(' ');
            const tryIdx = enN.toLowerCase().indexOf(candidate.toLowerCase());
            if(tryIdx !== -1){ idx = tryIdx; matchLen = candidate.length; break; }
          }
        }
      }
    }
  }
  if(idx === -1) return {html: en, blanked:false};
  const matched = en.slice(idx, idx+matchLen);
  const wordCount = matched.trim().split(/\s+/).filter(Boolean).length;
  const blanks = Array(wordCount).fill('<span class="blank-underline"></span>').join(' ');
  return {html: en.slice(0,idx) + blanks + en.slice(idx+matchLen), blanked:true};
}

  const saveBtn = document.getElementById('btnSaveRange');

      const row = document.createElement('div');

      delBtn.onclick = ()=>{

      const restoreBtn = document.createElement('div');

      row.appendChild(restoreBtn);
      exBox.appendChild(row);
    });
    const btn = document.getElementById('btnToFormat');
    btn.disabled = printCtx.words.length === 0;
  }
  refresh();
  document.getElementById('btnToFormat').onclick = ()=>nav({screen:'preview'});
}

function answerLineHtml(word){
  const tokens = word.replace(/\.\.\./g,'…').split(/\s+/).filter(Boolean);
  if(tokens.length <= 1) return '<div class="blank-answer-line"></div>';
  const parts = tokens.map(t=>{
    if(t === '～') return '<div class="blank-answer-gap">&nbsp;&nbsp;&nbsp;</div>';
    if(t === '…') return '<div class="blank-answer-ellipsis">…</div>';
    return '<div class="blank-answer-seg"></div>';
  });
  return `<div class="blank-answer-multi">${parts.join('')}</div>`;
}

function highlightMeaningInJa(ja, meaning){
  if(!ja || !meaning) return ja;
  const firstSeg = meaning.split(/[、，,（(]/)[0].trim();
  const minLen = firstSeg.length <= 1 ? 1 : 2;
  for(let len = firstSeg.length; len >= minLen; len--){
    const candidate = firstSeg.slice(0, len);
    const idx = ja.indexOf(candidate);
    if(idx !== -1){
      return ja.slice(0,idx) + '<span class="ja-highlight">' + ja.slice(idx, idx+candidate.length) + '</span>' + ja.slice(idx+candidate.length);
    }
  }
  return ja;
}

function chunk(arr, size){
  const out = [];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}

    <div class="back-row" id="back">← 単語の確認にもどる</div>
    <h2 style="margin-bottom:4px;">プレビュー</h2>
    <div class="setting-desc" style="margin-bottom:10px;">${printCtx.grade}年生・${printCtx.rangeLabel}（${printCtx.words.length}語）。1枚目：折って覚えるシート（番号順）／2枚目：空所補充（順番はランダム、番号なし）／3枚目：2枚目と同じ順番の解答。</div>
    <div class="setting-desc" style="margin-bottom:8px;">印刷の向き（単語数が多いときは縦、少なく絞って書く練習を広くしたいときは横がおすすめです）</div>
    <div class="chip-row" id="orientChips" style="margin-bottom:16px;"></div>
    <button class="btn btn-primary" id="btnPrint">🖨 印刷する</button>
    <button class="btn btn-ghost" id="btnBack2" style="margin-top:10px;">単語の確認にもどる</button>
  `;
  document.getElementById('back').onclick = ()=>nav({screen:'review'});
  document.getElementById('btnBack2').onclick = ()=>nav({screen:'review'});

  const orientChips = document.getElementById('orientChips');
  [{key:'portrait', label:'縦'}, {key:'landscape', label:'横'}].forEach(o=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (printOrientation===o.key ? ' selected':'');
    chip.textContent = o.label;
    chip.onclick = ()=>{ printOrientation = o.key; renderPreview(); };
    orientChips.appendChild(chip);
  });

  buildPrintSheet(printCtx.words, printCtx.grade, printCtx.rangeLabel);
  applyOrientationStyle();
  document.getElementById('printSheet').classList.add('preview-visible');
  document.getElementById('btnPrint').onclick = ()=>{ window.print(); };
}

function sheetHeader(title, sub){
  return `<div class="sheet-header"><div class="sheet-title">${title}</div><div class="sheet-sub">${sub}</div></div>`;
}

function buildFoldPages(words, title){
  const perPage = 20;
  const pages = chunk(words, perPage);
  const out = [];
  pages.forEach((pageWords, pi)=>{
    const page = document.createElement('div');
    page.className = 'sheet-page';
    page.innerHTML = sheetHeader(title, `折って覚えるシート ${pi+1}/${pages.length}ページ`) +
      `<div class="fold-instructions">① 点線で谷折りにして右の英語を隠す　② 日本語を見て真ん中に英語を書く　③ 開いて答え合わせ　④ 間違えた単語は真ん中のスペースに何度も書いて練習する</div>`;
    const table = document.createElement('table');
    table.className = 'fold-table';
    const thead = document.createElement('tr');
    thead.innerHTML = `<td class="fold-num"></td><td class="fold-ja-h">日本語</td><td class="fold-practice-h">書いて練習</td><td class="fold-en-h">英語（答え）</td>`;
    table.appendChild(thead);
    pageWords.forEach((e,idx)=>{
      const num = pi*perPage + idx + 1;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="fold-num">(${num})</td>
        <td class="fold-ja">${e.meaning}</td>
        <td class="fold-practice"></td>
        <td class="fold-en">${e.word}</td>`;
      table.appendChild(tr);
    });
    page.appendChild(table);
    out.push(page);
  });
  return out;
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildBlankPages(shuffledWords, title){
  const perPage = 30;
  const pages = chunk(shuffledWords, perPage);
  const out = [];
  pages.forEach((pageWords, pi)=>{
    const page = document.createElement('div');
    page.className = 'sheet-page';
    page.innerHTML = sheetHeader(title, `空所補充（例文の穴埋め） ${pi+1}/${pages.length}ページ`);
    const grid = document.createElement('div');
    grid.className = 'blank-grid';
    pageWords.forEach(e=>{
      const div = document.createElement('div');
      div.className = 'blank-item';
      const ex = e.example_en ? blankExample(e.example_en, e.word) : null;
      const hint = (ex && e.example_ja) ? highlightMeaningInJa(e.example_ja, e.meaning) : `意味：${e.meaning}`;
      div.innerHTML = `
        <div class="blank-meaning">${hint}</div>
        ${ex ? `<div class="blank-example">${ex.html}</div>` : `<div class="blank-example">${answerLineHtml(e.word)}</div>`}`;
      grid.appendChild(div);
    });
    page.appendChild(grid);
    out.push(page);
  });
  return out;
}

function buildAnswerPages(shuffledWords, title){
  const perPage = 30;
  const pages = chunk(shuffledWords, perPage);
  const out = [];
  pages.forEach((pageWords, pi)=>{
    const page = document.createElement('div');
    page.className = 'sheet-page';
    page.innerHTML = sheetHeader(title, `空所補充・解答（問題と同じ順番） ${pi+1}/${pages.length}ページ`);
    const grid = document.createElement('div');
    grid.className = 'blank-grid';
    pageWords.forEach(e=>{
      const div = document.createElement('div');
      div.className = 'blank-item';
      div.innerHTML = `<span class="wcol">${e.word}</span>`;
      grid.appendChild(div);
    });
    page.appendChild(grid);
    out.push(page);
  });
  return out;
}

function buildPrintSheet(words, grade, rangeLabel){
  const sheet = document.getElementById('printSheet');
  sheet.innerHTML = '';
  const title = `${grade}年生 単語プリント（${rangeLabel}）`;
  if(!printCtx.shuffledBlankWords) printCtx.shuffledBlankWords = shuffleArray(words);
  buildFoldPages(words, title).forEach(p=>sheet.appendChild(p));
  buildBlankPages(printCtx.shuffledBlankWords, title).forEach(p=>sheet.appendChild(p));
  buildAnswerPages(printCtx.shuffledBlankWords, title).forEach(p=>sheet.appendChild(p));
}

nav({screen:'picker'});
</script>
</body>
</html>
